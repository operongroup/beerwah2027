<!DOCTYPE html>

<title>Beerwah@Night 2027 — Sub-50</title>
<style>
:root{
  color-scheme:dark;
  --page:#0A0C15; --surface:#141927; --surface2:#0E1220;
  --ink:#F5F3F0; --ink2:#A7ADBD; --muted:#6E7488;
  --grid:#232A3C; --axis:#323A50; --border:rgba(255,255,255,.07);
  --brand:#FF5A24; --brand2:#FF7A3D; --branddeep:#C23A10;
  --s1:#F5551E; --s2:#3987E5; --s3:#199E70;
  --z1:#FFC09B; --z2:#FF6B35; --z3:#B33409;
  --good:#2FC24F; --warn:#FAB219; --serious:#EC835A; --crit:#E5484D; --goodtext:#35C759;
  --night:#8E7CF0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--page)}
body{font-family:-apple-system,system-ui,"Segoe UI",sans-serif;color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:78px;
  background:radial-gradient(120% 60% at 50% -10%, #1A2138 0%, #10141F 45%, #0A0C15 100%) fixed}
header{padding:18px 18px 6px;display:flex;gap:12px;align-items:center;max-width:880px;margin:0 auto}
header .mark{width:42px;height:42px;border-radius:11px;flex:none;box-shadow:0 4px 16px rgba(255,90,36,.28)}
header h1{font-size:15px;font-weight:800;letter-spacing:.14em}
header h1 span{color:var(--brand)}
header .tag{font-size:11px;color:var(--muted);letter-spacing:.04em;font-weight:600}
header .count{margin-left:auto;text-align:right}
header .count b{display:block;font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,#FF7A3D,#FF5A24);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header .count span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.chips{padding:8px 18px 10px;display:flex;gap:6px;flex-wrap:wrap;max-width:880px;margin:0 auto}
.chip{font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:99px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--ink2)}
.chip.acc{border-color:rgba(255,90,36,.5);color:var(--brand2);background:rgba(255,90,36,.10)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(13,16,26,.85);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-top:1px solid var(--border);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 0 7px;border:0;background:none;color:var(--muted);font-size:9.5px;font-weight:700;letter-spacing:.03em;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand)}
main{max-width:880px;margin:0 auto;padding:4px 14px 24px}
.card{background:linear-gradient(180deg,#171C2D 0%,#131726 100%);border:1px solid var(--border);border-radius:20px;padding:17px;margin-bottom:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.32)}
.card h2{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px}
.card h3{font-size:17px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 9px;border-radius:99px;margin:0 6px 6px 0}
.pill.night{background:rgba(142,124,240,.16);color:var(--night);border:1px solid rgba(142,124,240,.4)}
.pill.test{background:rgba(255,90,36,.14);color:var(--brand2);border:1px solid rgba(255,90,36,.45)}
.pill.race{background:rgba(229,72,77,.15);color:#FF7B80;border:1px solid rgba(229,72,77,.5)}
.pill.down{background:rgba(255,255,255,.06);color:var(--ink2);border:1px solid var(--border)}
.pill.done{background:rgba(47,194,79,.15);color:var(--goodtext);border:1px solid rgba(47,194,79,.45)}
.pill.loc{background:rgba(255,255,255,.06);color:var(--ink2);border:1px solid var(--border)}
.locwrap{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.locwrap .lbl{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.locbtn{font-size:11px;font-weight:700;padding:6px 12px;border-radius:99px;cursor:pointer;
  background:transparent;color:var(--ink2);border:1px solid var(--border)}
.locbtn.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.pres{font-size:14px;color:var(--ink2);white-space:pre-wrap;margin:7px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.btn{background:linear-gradient(135deg,#FF6A2F,#E8430E);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 16px rgba(255,90,36,.30)}
button.btn:active{transform:scale(.97)}
button.btn:disabled{opacity:.4;box-shadow:none}
button.ghost,label.ghost{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--ink);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
button.ghost.on{border-color:var(--brand);color:var(--brand)}
input,textarea,select{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px;font-size:14px;color:var(--ink);font-family:inherit}
input:focus{outline:none;border-color:rgba(255,90,36,.6)}
input[type=number]{width:76px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:13px}
.tile{background:linear-gradient(180deg,#171C2D,#131726);border:1px solid var(--border);border-radius:16px;padding:12px 14px}
.tile .v{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .l{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.hero{display:flex;align-items:center;gap:18px}
.hero .hr-ring{flex:none}
.hero .ht{flex:1}
.hero .ht b{font-size:19px;font-weight:800;letter-spacing:-.01em}
.hero .ht p{font-size:13px;color:var(--ink2);margin-top:2px}
.hero .ht .small{margin-top:6px}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--grid)}
.verdict:first-of-type{border-top:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;box-shadow:0 0 10px currentColor}
.verdict b{font-size:14px}
.verdict p{font-size:13px;color:var(--ink2)}
.bar{height:7px;border-radius:4px;background:var(--grid);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FF7A3D,#E8430E);border-radius:4px}
.bar i.alt{background:linear-gradient(90deg,#5FA4F0,#2A6FC4)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:5px 6px;border-bottom:1px solid var(--grid)}
td{padding:7px 6px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
.grid27{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:7px}
.wk{border:1px solid var(--border);border-radius:13px;padding:8px 9px;cursor:pointer;background:rgba(255,255,255,.025)}
.wk.cur{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),0 4px 14px rgba(255,90,36,.25)}
.wk .n{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.05em}
.wk .p{font-size:11px;font-weight:800}
.wk .k{font-size:12px;color:var(--ink2)}
svg text{font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:2px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#F5F3F0;color:#10141F;font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;z-index:99;display:none;max-width:240px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.day{display:flex;gap:11px;padding:10px 4px;border-top:1px solid var(--grid);cursor:pointer;border-radius:8px}
.day:hover{background:rgba(255,255,255,.025)}
.day .d{width:40px;flex:none;text-align:center}
.day .d b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.day .d span{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.08em}
.day .t{flex:1;min-width:0}
.day .t b{font-size:14px}
.day .t p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .st{flex:none;font-size:13px;color:var(--goodtext);align-self:center;font-weight:800}
details{border-top:1px solid var(--grid);padding:9px 0}
details summary{cursor:pointer;font-weight:700;font-size:14px}
details p, details li{font-size:13px;color:var(--ink2);margin:5px 0}
details ul{padding-left:18px}
.small{font-size:12px;color:var(--muted)}
.ok{color:var(--goodtext);font-weight:700}
.bad{color:var(--crit);font-weight:700}
.hide{display:none!important}
.exlist{margin-top:6px}
.exrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--grid)}
.exrow:first-child{border-top:0}
.exrow input[type=checkbox]{width:19px;height:19px;accent-color:var(--brand);flex:none;cursor:pointer}
.exn{flex:1;min-width:0}
.exn b{font-size:14px;display:block}
.exn span{font-size:12px;color:var(--muted)}
.exl{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.exl input.w{width:66px;text-align:right}
.exlast{font-size:10.5px;color:var(--muted)}
.spark{flex:none}
details.exd summary{display:flex;align-items:center;gap:10px;list-style:none;flex-wrap:wrap}
.setbtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(255,90,36,.12);border:1px solid rgba(255,90,36,.45);color:var(--brand2);border-radius:10px;padding:6px 10px;font-size:11px;font-weight:800;cursor:pointer;min-width:74px}
.setbtn.fin{background:rgba(47,194,79,.13);border-color:rgba(47,194,79,.45);color:var(--goodtext)}
.setbtn .dots{display:flex;gap:3px}
.setbtn .dots i{width:7px;height:7px;border-radius:50%;background:var(--grid);display:block}
.setbtn .dots i.on{background:currentColor}
.timerbar{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:60;background:linear-gradient(135deg,#1E2436,#171C2D);border:1px solid rgba(255,90,36,.5);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:560px;margin:0 auto}
.timerbar b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--brand2);min-width:64px}
.timerbar span{font-size:12px;color:var(--ink2);flex:1}
.timerbar .tb{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--ink);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer}
.timerbar.go{border-color:var(--good);animation:pulse 1s ease-in-out 3}
.timerbar.go b{color:var(--goodtext);font-size:16px;flex:1;min-width:0}
@keyframes pulse{50%{box-shadow:0 0 24px rgba(47,194,79,.5)}}
details.wucd{border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin:8px 0;background:rgba(255,255,255,.02)}
details.wucd summary{font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:.02em}
.wurow{padding:7px 0;border-top:1px solid var(--grid)}
.wurow:first-of-type{border-top:0;margin-top:6px}
.wurow b{font-size:13.5px}
.wurow .dose{font-size:12px;color:var(--brand2);font-weight:700;margin-left:6px}
.wurow p{font-size:12.5px;color:var(--muted);margin-top:1px}
.wl{display:flex;gap:11px;align-items:flex-start;cursor:pointer;width:100%}
.wl input{width:18px;height:18px;accent-color:var(--brand);flex:none;margin-top:2px;cursor:pointer}
.wuc{color:var(--brand2);font-weight:800}
.wuc.ok{color:var(--goodtext)}
.wurow.added{display:flex;align-items:flex-start;gap:6px}
.wurow.added .wl{flex:1}
.rmx{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 6px;flex:none}
.addpick{border-top:1px dashed var(--grid);margin-top:7px;padding:7px 0 0;border-left:0;border-right:0;border-bottom:0;border-radius:0;background:none}
.addpick summary{font-size:12.5px;color:var(--brand2);font-weight:700;list-style:none;cursor:pointer}
.libchips{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
button.lib{font-size:12px;padding:6px 10px;text-align:left}
button.lib span{color:var(--muted);font-size:11px}
.tmr{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--brand2);border-radius:8px;padding:5px 9px;font-size:11px;font-weight:800;cursor:pointer;flex:none;margin-top:2px;white-space:nowrap}
.tmrrow{display:flex;align-items:flex-start;gap:6px}
.tmrrow .wl{flex:1}
.setcol{display:flex;flex-direction:column;gap:4px;align-items:stretch;flex:none}
.setrow{display:flex;gap:4px;justify-content:center}
.minib{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--ink2);border-radius:7px;padding:3px 7px;font-size:10.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.minib.won{border-color:rgba(255,90,36,.5);color:var(--brand2);background:rgba(255,90,36,.10)}
.minib.tclr{color:var(--brand2)}
.setbtn .dots em{font-style:normal;font-size:9px;color:var(--goodtext);font-weight:800;margin-left:2px}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:84px;z-index:60;
  background:#1d2333;border:1px solid #FF5A24;color:#fff;font-weight:700;font-size:14px;
  padding:10px 18px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:#FF5A24;margin-right:6px}
.btn.saved{background:var(--good);border-color:var(--good);color:#fff}
</style>
</head>

const CHAIN = [[1600,3335,3720],[1440,3000,3345],[1350,2815,3140],[1290,2690,3000]]; // [5k, flat10k, beerwah] seconds
function chain(fiveK){
  const c=CHAIN; if(fiveK>=c[0][0]){ const r=fiveK/c[0][0]; return [c[0][1]*r, c[0][2]*r]; }
  if(fiveK<=c[3][0]){ const r=fiveK/c[3][0]; return [c[3][1]*r, c[3][2]*r]; }
  for(let i=0;i<3;i++){ const a=c[i],b=c[i+1];

      os.frequency.value=i===2?1320:880; os.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.28, ctx.currentTime+d); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+d+0.18);
      os.start(ctx.currentTime+d); os.stop(ctx.currentTime+d+0.2); });

function startRest(secs,label,goText,mode){

    if(left<=0){
      clearInterval(restTimer.iv); beep();
      bar.classList.add("go");
      bar.innerHTML=`<b>GO — ${esc(restTimer.goText)}</b><button class="tb" onclick="hideTimer()">✕</button>`;

  }).join("") : `<p class="small">Builds itself as you tick off lifts. Each exercise gets a load-over-time trend, the "am I moving up" view.</p>`)+`</div>`;
  html+=`<div class="card"><h2>Loading rules</h2><details open><summary>Progression + elbow/back constraints</summary>
    <ul><li>115kg is the plate ceiling. When 4x5 stops feeling heavy: 3s lowering + 2s pause, not load.</li>
    <li>Effort is set by "reps in the tank": how many more reps you could have done before failing. Weeks 1-4: stop 3 short of failure. Heavy phase (from Wk5): stop 1-2 short. From Wk18: maintenance, stop 2-3 short. Never grind a rep on this program.</li>
    <li>NO conventional deadlifts (back). NO barbell rows, chin-ups, skull crushers, heavy curls (elbow). Squat: high bar, wide grip, elbows down and back.</li>
    <li>Deload in every down week: 2 sets, moderate. Last heavy lift W25. Nothing from W27.</li>
    <li>Plyos (from W11): before lifting, Tuesdays only, never the day before Thursday terrain.</li></ul></details></div>`;
  return html;
}
// ---------- Progress ----------
function rProgress(){
  return `<div class="card"><h2>Weekly volume — planned vs actual</h2>
    <div class="legend"><span><i style="background:var(--s1)"></i>Actual km</span><span><i style="background:none;border:1.5px solid var(--axis)"></i>Planned km</span></div>
    <div id="chVol"></div></div>
  <div class="card"><h2>5km time trials vs the 21:30 chain</h2>
    <div class="legend"><span><i style="background:var(--s1)"></i>Your TTs</span><span><i style="background:none;border:1.5px dashed var(--muted)"></i>Marker chain to podium</span></div>
    <div id="chTT"></div></div>
  <div class="card"><h2>Zone discipline — time by intensity</h2>
    <div class="legend"><span><i style="background:var(--z1)"></i>Z1 easy</span><span><i style="background:var(--z2)"></i>Z2 steady/threshold</span><span><i style="background:var(--z3)"></i>Z3 hard</span></div>
    <div id="chZone"></div><p class="small" id="zoneNote"></p></div>
  <div class="card"><h2>Race predictor</h2><div id="chPred"></div></div>`;
}
function svgOpen(w,h){ return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">`; }
function drawCharts(){
  const W=Math.min(820,$("#chVol").clientWidth||760), H=190, L=30, B=22;
  const cur=Math.min(27,Math.max(1,weekOf(todayISO())));
  // volume chart
  let max=60; const bw=(W-L-6)/27;
  let s=svgOpen(W,H);
  for(const g of [0,20,40,60]){ const y=(H-B)-(H-B-8)*g/max;
    s+=`<line x1="${L}" y1="${y}" x2="${W}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${L-5}" y="${y+3}" font-size="9" fill="var(--muted)" text-anchor="end">${g}</text>`; }
  for(let w=1;w<=27;w++){ const m=WEEKS[w]; const a=weekActual(w);
    const x=L+(w-1)*bw+1.5, wd=bw-3;
    const ph=(H-B-8)*m.km/max, py=(H-B)-ph;
    s+=`<rect x="${x}" y="${py}" width="${wd}" height="${ph}" rx="3" fill="none" stroke="var(--axis)" stroke-width="1" data-tip="W${w} planned ${m.km}km"/>`;
    if(a.km>0){ const ah=(H-B-8)*Math.min(max,a.km)/max, ay=(H-B)-ah;
      s+=`<rect x="${x+1.5}" y="${ay}" width="${Math.max(2,wd-3)}" height="${ah}" rx="3" fill="var(--s1)" data-tip="W${w} actual ${a.km.toFixed(1)}km / ${m.km} planned"/>`;
      if(w===cur) s+=`<text x="${x+wd/2}" y="${ay-5}" font-size="10" font-weight="800" fill="var(--s1)" text-anchor="middle">${a.km.toFixed(1)}</text>`; }
    if(w%5===0||w===1||w===27) s+=`<text x="${x+wd/2}" y="${H-8}" font-size="9" fill="var(--muted)" text-anchor="middle">W${w}</text>`;
    if(w===cur) s+=`<line x1="${x+wd/2}" y1="8" x2="${x+wd/2}" y2="14" stroke="var(--s2)" stroke-width="2"/>`;
  }
  s+=`<line x1="${L}" y1="${H-B}" x2="${W}" y2="${H-B}" stroke="var(--axis)"/></svg>`;
  const curA=weekActual(cur), curM=WEEKS[cur];
  $("#chVol").innerHTML=s+`<p class="small" style="margin-top:6px">Week ${cur} so far: <b style="color:var(--brand2)">${curA.km.toFixed(1)}</b> of ${curM.km}km (${Math.round(100*curA.km/curM.km)}%)${curA.vert?` · ${Math.round(curA.vert)}m vert`:""}</p>`;
  // TT chart
  const tts=loggedTTs(); const mk=Object.entries(TT_MARKERS).map(([w,v])=>({w:+w,v}));
  const wks=[1,8,16,23,27]; const x27=w=>L+ (W-L-14)*(w-1)/26;
  const tmin=1230, tmax=1660; const yT=v=>14+(H-B-22)*(v-tmin)/(tmax-tmin);
  let q=svgOpen(W,H);
  for(const g of [1620,1500,1380,1290]){ const y=yT(g);
    q+=`<line x1="${L}" y1="${y}" x2="${W}" y2="${y}" stroke="var(--grid)"/><text x="${L-5}" y="${y+3}" font-size="9" fill="var(--muted)" text-anchor="end">${fmtT(g)}</text>`; }
  q+=`<path d="${mk.map((m,i)=>(i?"L":"M")+x27(m.w)+" "+yT(m.v)).join(" ")} L ${x27(27)} ${yT(1290)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  q+=`<circle cx="${x27(27)}" cy="${yT(1290)}" r="5" fill="none" stroke="var(--muted)" stroke-width="1.5"/><text x="${x27(27)-8}" y="${yT(1290)-8}" font-size="10" fill="var(--ink2)" text-anchor="end">21:30 → podium</text>`;
  if(tts.length>1) q+=`<path d="${tts.map((t,i)=>(i?"L":"M")+x27(t.week)+" "+yT(t.secs)).join(" ")}" fill="none" stroke="var(--s1)" stroke-width="2"/>`;
  for(const t of tts) q+=`<circle cx="${x27(t.week)}" cy="${yT(t.secs)}" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" data-tip="W${t.week}: ${fmtT(t.secs)} (${t.label})"/><text x="${x27(t.week)}" y="${yT(t.secs)-10}" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="middle">${fmtT(t.secs)}</text>`;
  for(const w of wks) q+=`<text x="${x27(w)}" y="${H-6}" font-size="9" fill="var(--muted)" text-anchor="middle">${w===27?"RACE":"W"+w}</text>`;
  q+=`</svg>`;
  $("#chTT").innerHTML=q;
  // zone stacked bars (last 8 weeks with data)
  const zw=[]; for(let w=1;w<=Math.min(27,cur);w++){ const z=zoneWeek(w); if(z.tot>0) zw.push({w,...z}); }
  const zshow=zw.slice(-8);
  if(zshow.length){
    const bw2=Math.min(70,(W-L-10)/zshow.length); let z=svgOpen(W,120);
    zshow.forEach((d,i)=>{ const x=L+i*bw2+3; let y=96; const hgt=80;
      for(const [key,color] of [["z1","var(--z1)"],["z2","var(--z2)"],["z3","var(--z3)"]]){
        const h=hgt*d[key]/d.tot; if(h>0){ z+=`<rect x="${x}" y="${y-h}" width="${bw2-8}" height="${Math.max(0,h-2)}" rx="3" fill="${color}" data-tip="W${d.w} ${key.toUpperCase()}: ${Math.round(100*d[key]/d.tot)}%"/>`; y-=h; } }
      z+=`<text x="${x+(bw2-8)/2}" y="112" font-size="9" fill="var(--muted)" text-anchor="middle">W${d.w}</text>`;
      const z1p=Math.round(100*d.z1/d.tot);
      z+=`<text x="${x+(bw2-8)/2}" y="${96-82}" font-size="9" fill="${z1p<70?"var(--crit)":"var(--muted)"}" text-anchor="middle">${z1p}%</text>`;
    });
    z+=`</svg>`;
    $("#chZone").innerHTML=z;
    $("#zoneNote").textContent="Number above each bar = % easy. Target: 80% easy in every phase. Under 70% = grey-zone drift.";
  } else $("#chZone").innerHTML=`<p class="small">Appears once synced runs are in. Estimated from pace/HR per activity.</p>`;
  // predictor
  const tt=latest5k();
  if(tt){ const [f10,bw3]=chain(tt.secs);
    const rows=[["Current 5km",fmtT(tt.secs)],["→ Flat 10km equivalent",fmtT(f10)],["→ Beerwah@Night predicted",fmtT(bw3)],["Podium needs","sub-50:22 (2026) · safe: 48:30-49:00"]];
    $("#chPred").innerHTML=`<table>${rows.map(r=>`<tr><td>${r[0]}</td><td style="text-align:right"><b>${r[1]}</b></td></tr>`).join("")}</table>
    <p class="small" style="margin-top:6px">${bw3<=3022?"Predicted inside the podium window. Execute.":"Gap to podium: "+fmtT(bw3-3022)+". The chain: 5km → flat 10km → +11-12% terrain/darkness. Move the 5km, everything follows."}</p>`; }
  else $("#chPred").innerHTML=`<p class="small">Log a 5km TT to activate the predictor.</p>`;
  // tooltips
  document.querySelectorAll("[data-tip]").forEach(el=>{
    el.addEventListener("mousemove",e=>tipShow(e,esc(el.dataset.tip)));
    el.addEventListener("mouseleave",tipHide);
    el.addEventListener("click",e=>{tipShow(e,esc(el.dataset.tip));setTimeout(tipHide,1800)});
  });
}
function zoneWeek(wk){
  // estimate zone time from synced activities: pace-based on flat, HR fallback
  const mon=new Date(START+"T12:00"); mon.setDate(mon.getDate()+(wk-1)*7);
  let z1=0,z2=0,z3=0;
  for(let i=0;i<7;i++){ const d=iso(new Date(mon.getTime()+i*864e5));
    for(const a of actsOn(d)){ if(!a.secs||!a.km) continue;
      const pace=a.secs/a.km;
      if(a.hr){ if(a.hr<143) z1+=a.secs; else if(a.hr<168) z2+=a.secs; else z3+=a.secs; }
      else { if(pace>=385) z1+=a.secs; else if(pace>=330) z2+=a.secs; else z3+=a.secs; } } }
  return {z1,z2,z3,tot:z1+z2+z3};
}
// ---------- Rules ----------
function rRules(){
  return `<div class="card"><h2>Zones (from 27 Jul baseline — reset at W8 TT)</h2>
  <table><tr><th>Zone</th><th>Pace</th><th>HR</th><th>Feel</th></tr>
  <tr><td><b>Z1 easy</b></td><td><b>6:35–6:55</b></td><td><b>&lt;138</b></td><td>Full sentences</td></tr>
  <tr><td>Z2 steady</td><td>6:15–6:30</td><td>138–153</td><td>Comfortable</td></tr>
  <tr><td>Threshold</td><td>5:40–5:50</td><td>155–170</td><td>Comfortably hard</td></tr>
  <tr><td>Z3 hard</td><td>5:20–5:25</td><td>172+</td><td>3-word answers</td></tr></table>
  <p class="small" style="margin-top:6px">Uphill is ALWAYS by effort/HR, never pace. Easy at 6:45 even though it feels absurd — grey zone (6:00–6:30) is fatigue without adaptation.</p></div>

  <div class="card"><h2>Injury decision rules — the traffic light</h2>
  <div class="verdict"><span class="dot" style="background:var(--good)"></span><div><b>0–2/10, gait unchanged</b><p>Continue. Note it in the session log so patterns show up.</p></div></div>
  <div class="verdict"><span class="dot" style="background:var(--warn)"></span><div><b>3–4/10 during, settles within 24h, no morning stiffness</b><p>Finish at reduced intensity and flag it. Two flags in a row = swap the next quality session for easy, and take the down week early if one is near.</p></div></div>
  <div class="verdict"><span class="dot" style="background:var(--crit)"></span><div><b>5+/10, sharp/sudden, or it changes your stride</b><p>Stop the session. Two days off running. Easy 20-min test run day 3 — pain-free means resume, otherwise book the physio.</p></div></div>
  <details><summary>Achilles / calf red flags (the returning-runner pattern)</summary>
  <ul><li>Morning stiffness &gt; 30 min → drop hills and strides until it's back under 10 min.</li>
  <li>Pain that "warms up" mid-run then returns worse after → tendon warning, not soreness. Cut volume 30% for the week.</li>
  <li>Localised tenderness you can press on the tendon → physio within 5 days. Keep strength (calf raises ARE the treatment).</li>
  <li>Capacity benchmark: work toward 25 single-leg calf raises per side with under 10% left-right difference. Test monthly on a Monday.</li>
  <li>Anything after sand or new-surface days gets 48h grace before judging.</li></ul></details>
  <details><summary>Knee + back + elbow</summary>
  <ul><li>Knee pain descending stairs next morning → skip the next descent session, keep everything else. Heavy leg work is the treatment, not the risk.</li>
  <li>Back: no conventional deadlifts, ever. RDLs at moderate load.</li>
  <li>Elbow: get it professionally assessed (action item). Skip DB press if it objects.</li></ul></details>
  <details><summary>Warm-ups / cool-downs</summary>
  <ul><li><b>Quality runs:</b> 15 min easy building + leg swings, A-skips, high knees + 4 x 20s strides. CD 10 min easy.</li>
  <li><b>TTs / races:</b> 15 min easy + drills + 3 strides + 2 min at target pace, 3 min easy, start. CD 10 min.</li>
  <li><b>Hills/terrain:</b> 15 min easy to the hill + 2 strides on the grade. CD 10 min.</li>
  <li><b>Long runs:</b> first 2km slower than easy.</li>
  <li><b>Strength:</b> after the run. 2 ramp-up sets (~50%, ~70%) before work sets.</li></ul></details></div>

  <div class="card"><h2>Non-negotiables</h2><details open><summary>The eight rules</summary>
  <ul><li>Down weeks are mandatory. 12→52km/wk is where the injury lives.</li>
  <li>Head torch by W16 — 500+ lumens, dual beam (flood for footing, spot for descents) + backup. TRAIN in it, especially fast descents.</li>
  <li>Trail shoes with real grip (~1 min saved on its own).</li>
  <li>Power-hike the Dungeon — train it as a skill.</li>
  <li>Heat: SEQ summer training does the acclimating. Race-week top-up (W26): easy runs in the heat of day + optional 30 min hot bath after. Quality stays morning.</li>
  <li>Gravl = upper body / mobility on easy days only.</li>
  <li>Elbow assessed early.</li>
  <li>Race fuel: carb lunch, light carb snack ~4pm, caffeine ~250-400mg at 6pm, water only on course. Practise the full timing at the W24 rehearsal.</li></ul></details>
  <details><summary>Race day kit + entries checklist</summary>
  <ul><li>☐ Enter Beerwah@Daybreak (closes 30 Nov)</li><li>☐ Enter flat road 10km (Oct/Nov)</li>
  <li>☐ Enter Beerwah@Night (closes 24 Jan — no entries on the day)</li>
  <li>☐ Head torch 500+ lm dual beam ☐ backup torch ☐ trail shoes ☐ caffeine ☐ electrolytes ☐ compression bandage (mandatory gear) ☐ phone</li></ul></details></div>`;
}
// ---------- Sync ----------
function rSync(){
  const c=store.cfg;
  return `<div class="card"><h2>intervals.icu sync</h2>
  <p class="small">One-time setup: create a free <b>intervals.icu</b> account → Settings → connect <b>Garmin</b> → scroll to <b>Developer Settings</b> → copy your <b>API key</b> and <b>Athlete ID</b> (looks like i123456).</p>
  <div class="row" style="margin-top:8px">
    <label class="f">Athlete ID<input id="aid" value="${esc(c.aid||"")}" placeholder="i123456"></label>
    <label class="f">API key<input id="akey" type="password" value="${esc(c.key||"")}"></label>
    <button class="btn" onclick="saveCfg()">Save</button>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn" onclick="syncNow()" ${c.key?"":"disabled"}>Sync now</button>
    <span class="small" id="syncmsg">${c.last?("Last sync: "+new Date(c.last).toLocaleString()+" · "+store.acts.length+" runs"):"Never synced"}</span>
  </div></div>
  <div class="card"><h2>Backup / move devices</h2>
  <div class="row"><button class="ghost" onclick="expData()">Export logs (JSON)</button>
  <label class="ghost" style="cursor:pointer">Import<input type="file" class="hide" onchange="impData(event)"></label>
  </div>
  <p class="small" style="margin-top:6px">Logs live in this browser. Export before moving devices; synced Garmin data re-pulls anywhere.</p></div>`;
}
function saveCfg(){ const c=store.cfg; c.aid=$("#aid").value.trim(); c.key=$("#akey").value.trim(); store.cfg=c; render(); toast("Settings saved"); }
async function syncNow(){
  const c=store.cfg; const msg=$("#syncmsg"); if(msg) msg.textContent="Syncing…";
  const auth="Basic "+btoa("API_KEY:"+c.key);
  try{
    const end=todayISO();
    const r=await fetch(`https://intervals.icu/api/v1/athlete/${encodeURIComponent(c.aid)}/activities?oldest=${START}&newest=${end}`,{headers:{Authorization:auth}});
    if(!r.ok) throw new Error("activities "+r.status);
    const acts=await r.json();
    const mapped = acts.filter(a=>a.type&&/run/i.test(a.type)).map(a=>({
      id:a.id, date:(a.start_date_local||"").slice(0,10), run:true,
      km:(a.distance||0)/1000, secs:a.moving_time||a.elapsed_time||0,
      vert:a.total_elevation_gain||a.icu_climb||0, hr:a.average_heartrate||null, name:a.name||"Run"}));
    // guard: Garmin + Strava can both deliver the same run — drop same-day near-identical duplicates
    const kept=[];
    for(const a of mapped){
      const dup=kept.find(b=>b.date===a.date && Math.abs(b.km-a.km)<Math.max(0.25,0.05*a.km) && Math.abs((b.secs||0)-(a.secs||0))<150);
      if(!dup) kept.push(a);
    }
    store.acts = kept;
    let wellCount=0;
    try{
      const rw=await fetch(`https://intervals.icu/api/v1/athlete/${encodeURIComponent(c.aid)}/wellness?oldest=${START}&newest=${end}`,{headers:{Authorization:auth}});
      if(rw.ok){ const wl=await rw.json();
        store.well=(Array.isArray(wl)?wl:[]).map(w=>({date:w.id||w.date, restingHR:w.restingHR||null, hrv:w.hrv||null, sleep:w.sleepSecs? w.sleepSecs/3600 : (w.sleepHours||null)})).filter(w=>w.date);
        wellCount=store.well.length; }
    }catch(e){}
    c.last=Date.now(); store.cfg=c;
    if(msg) msg.textContent=`Synced: ${store.acts.length} runs, ${wellCount} wellness days.`;
    setTimeout(render,900);
  }catch(err){
    if(msg) msg.innerHTML=`<span class="bad">Sync failed (${esc(err.message)}).</span> Check athlete ID + API key. If it persists, the browser may be blocking the request — tell Claude and we'll wire the fallback.`;
  }
}
function expData(){
  const blob=new Blob([JSON.stringify({logs:store.logs,str:store.str,cfg:{aid:store.cfg.aid}},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="beerwah-logs.json"; a.click();
}
function impData(ev){
  const f=ev.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(d.logs) store.logs=d.logs; if(d.str) store.str=d.str; render(); }catch(e){ alert("Bad file"); } };
  rd.readAsText(f);
}
render();
if(location.protocol.startsWith("http") && "serviceWorker" in navigator){ try{navigator.serviceWorker.register("sw.js");}catch(e){} }
// auto-sync on open if configured and stale (>3h)
(function(){ const c=store.cfg; if(c.key&&c.aid&&(!c.last||Date.now()-c.last>3*3600e3)){ try{syncNow();}catch(e){} } })();
</script>
